<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaffer — EPL Insights Dashboard</title>
<style>
  :root {
    --bg:#0e1117; --panel:#161b22; --panel2:#1c2230; --line:#273041;
    --text:#e6edf3; --muted:#8b949e; --accent:#3fb950; --accent2:#58a6ff;
    --warn:#f85149; --gold:#e3b341;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; align-items:center; justify-content:space-between;
    padding:16px 24px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:20px; margin:0; }
  header .meta { color:var(--muted); font-size:13px; }
  .container { max-width:1200px; margin:0 auto; padding:24px; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line);
    background:var(--panel2); color:var(--text); border-radius:8px; padding:8px 14px; }
  button:hover { border-color:var(--accent2); }
  h2 { font-size:15px; text-transform:uppercase; letter-spacing:.04em;
    color:var(--muted); margin:0 0 12px; }
  .grid { display:grid; grid-template-columns:2fr 1fr; gap:20px; }
  .card { background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:18px; margin-bottom:20px; }
  /* Insights hero */
  .insights { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:14px; }
  .insight { background:linear-gradient(135deg,var(--panel2),var(--panel));
    border:1px solid var(--line); border-left:3px solid var(--accent);
    border-radius:10px; padding:14px 16px; }
  .insight .t { font-weight:600; margin-bottom:4px; }
  .insight .d { color:var(--muted); font-size:14px; line-height:1.4; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; }
  td.r,th.r { text-align:right; }
  .form span { display:inline-block; width:16px; height:16px; line-height:16px;
    text-align:center; border-radius:3px; font-size:10px; font-weight:700; margin-right:2px; }
  .form .W { background:var(--accent); color:#04250f; }
  .form .D { background:#6e7681; color:#fff; }
  .form .L { background:var(--warn); color:#3d0b0a; }
  .muted { color:var(--muted); }
  .score { font-variant-numeric:tabular-nums; font-weight:600; }
  .note { color:var(--muted); font-size:12px; margin-top:8px; }
  /* Chat */
  #chat { display:flex; flex-direction:column; height:420px; }
  #log { flex:1; overflow-y:auto; padding-right:6px; }
  .msg { margin-bottom:12px; line-height:1.45; font-size:14px; }
  .msg.user { text-align:right; }
  .msg .bubble { display:inline-block; padding:8px 12px; border-radius:10px;
    max-width:85%; white-space:pre-wrap; }
  .msg.user .bubble { background:var(--accent2); color:#03121f; }
  .msg.bot .bubble { background:var(--panel2); }
  #chatform { display:flex; gap:8px; margin-top:10px; }
  #chatform input { flex:1; background:var(--panel2); border:1px solid var(--line);
    color:var(--text); border-radius:8px; padding:10px; font:inherit; }
  @media (max-width:880px){ .grid{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>⚽ Gaffer — EPL Insights Dashboard</h1>
  <div style="display:flex;align-items:center;gap:14px">
    <span class="meta" id="meta">Loading…</span>
    <button id="refresh">↻ Refresh</button>
  </div>
</header>

<div class="container">
  <!-- INSIGHTS: the 'raw data -> stories' layer, front and centre -->
  <div class="card">
    <h2>📊 Auto Insights</h2>
    <div class="insights" id="insights"><span class="muted">Crunching the numbers…</span></div>
  </div>

  <div class="grid">
    <div>
      <div class="card">
        <h2>League Table</h2>
        <table id="table"><tbody><tr><td class="muted">Loading…</td></tr></tbody></table>
        <div class="note" id="tablenote"></div>
      </div>
      <div class="card">
        <h2>Recent Results</h2>
        <div id="results"><span class="muted">Loading…</span></div>
      </div>
      <div class="card">
        <h2>Upcoming Fixtures</h2>
        <div id="fixtures"><span class="muted">Loading…</span></div>
      </div>
    </div>
    <div>
      <div class="card">
        <h2>🥅 Top Scorers</h2>
        <table id="scorers"><tbody><tr><td class="muted">Loading…</td></tr></tbody></table>
      </div>
      <div class="card">
        <h2>💬 Ask Gaffer</h2>
        <div id="chat">
          <div id="log"><div class="msg bot"><div class="bubble">Ask me anything about the Premier League — I read the live data above.</div></div></div>
          <form id="chatform">
            <input id="q" placeholder="e.g. Who's in the best form?" autocomplete="off">
            <button type="submit">Send</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = t => (t||"").replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function formHTML(form){
  if(!form) return '<span class="muted">—</span>';
  return '<span class="form">' + [...form].map(c=>`<span class="${c}">${c}</span>`).join('') + '</span>';
}

async function loadDashboard(){
  const d = await (await fetch('/api/dashboard')).json();
  $('#meta').textContent = `Season ${d.season} · updated ${d.fetched}`;

  // Insights
  $('#insights').innerHTML = d.insights.length
    ? d.insights.map(i=>`<div class="insight"><div class="t">${esc(i.title)}</div><div class="d">${esc(i.detail)}</div></div>`).join('')
    : '<span class="muted">Not enough matches played yet for insights.</span>';

  // Table
  if(d.standings.length){
    $('#table').innerHTML = '<thead><tr><th>#</th><th>Team</th><th class="r">Pl</th><th class="r">W-D-L</th><th class="r">GD</th><th class="r">Pts</th><th>Form</th></tr></thead><tbody>' +
      d.standings.map(s=>`<tr><td>${s.rank}</td><td>${esc(s.team)}</td><td class="r">${s.played}</td><td class="r">${s.win}-${s.draw}-${s.loss}</td><td class="r">${s.gd}</td><td class="r"><b>${s.points}</b></td><td>${formHTML(s.form)}</td></tr>`).join('') + '</tbody>';
    $('#tablenote').textContent = 'Note: the free data source may list only the leading clubs.';
  }

  // Scorers
  $('#scorers').innerHTML = '<thead><tr><th>#</th><th>Player</th><th class="r">G</th><th class="r">A</th></tr></thead><tbody>' +
    d.scorers.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.name)}<div class="muted" style="font-size:12px">${esc(s.team)}</div></td><td class="r score">${s.goals}</td><td class="r">${s.assists}</td></tr>`).join('') + '</tbody>';

  // Results
  $('#results').innerHTML = d.results.length
    ? d.results.map(r=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="muted" style="font-size:12px">${esc(r.date)}</span><br>${esc(r.home)} <span class="score">${r.home_score}–${r.away_score}</span> ${esc(r.away)}</div>`).join('')
    : '<span class="muted">No recent results.</span>';

  // Fixtures
  $('#fixtures').innerHTML = d.fixtures.length
    ? d.fixtures.map(f=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="muted" style="font-size:12px">${esc(f.when)}</span><br>${esc(f.home)} vs ${esc(f.away)}</div>`).join('')
    : '<span class="muted">No upcoming fixtures listed.</span>';
}

$('#refresh').onclick = async () => {
  $('#refresh').textContent = '↻ …';
  await fetch('/api/refresh', {method:'POST'});
  await loadDashboard();
  $('#refresh').textContent = '↻ Refresh';
};

// Chat (streams from the existing /api/chat endpoint)
const history = [];
$('#chatform').onsubmit = async (e) => {
  e.preventDefault();
  const q = $('#q').value.trim(); if(!q) return;
  $('#q').value = '';
  history.push({role:'user', content:q});
  $('#log').innerHTML += `<div class="msg user"><div class="bubble">${esc(q)}</div></div>`;
  const botDiv = document.createElement('div');
  botDiv.className = 'msg bot'; botDiv.innerHTML = '<div class="bubble">…</div>';
  $('#log').appendChild(botDiv);
  $('#log').scrollTop = $('#log').scrollHeight;
  try {
    const resp = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({messages:history})});
    const reader = resp.body.getReader(); const dec = new TextDecoder(); let text='';
    botDiv.querySelector('.bubble').textContent = '';
    while(true){ const {done,value}=await reader.read(); if(done) break;
      text += dec.decode(value,{stream:true}); botDiv.querySelector('.bubble').textContent = text;
      $('#log').scrollTop = $('#log').scrollHeight; }
    history.push({role:'assistant', content:text});
  } catch(err){ botDiv.querySelector('.bubble').textContent = 'Error: '+err; }
};

loadDashboard();
</script>
</body>
</html>
