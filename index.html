<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaffer · EPL Chatbot</title>
<style>
  :root {
    --bg: #0b0d1a;
    --panel: #14172b;
    --panel2: #1c2040;
    --accent: #00ff85;     /* Premier League green */
    --accent2: #963cff;    /* Premier League purple */
    --text: #e8eaf2;
    --muted: #8b90b0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #21134a 0%, var(--bg) 55%);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid #262a4d;
    background: rgba(20,23,43,0.7);
    backdrop-filter: blur(8px);
  }
  .badge {
    width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    display: grid; place-items: center;
    font-weight: 800; color: #0b0d1a; font-size: 18px;
  }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .3px; }
  header p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
  .live-dot {
    margin-left: auto; font-size: 11px; color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  .live-dot i {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 8px var(--accent);
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  #chat {
    flex: 1; overflow-y: auto; padding: 22px;
    display: flex; flex-direction: column; gap: 14px;
    max-width: 820px; width: 100%; margin: 0 auto;
  }
  .msg { display: flex; gap: 10px; max-width: 88%; }
  .msg .av {
    width: 30px; height: 30px; border-radius: 50%; flex: none;
    display: grid; place-items: center; font-size: 14px; font-weight: 700;
  }
  .bubble {
    padding: 11px 14px; border-radius: 14px; line-height: 1.5;
    white-space: pre-wrap; word-wrap: break-word; font-size: 14.5px;
  }
  .bot { align-self: flex-start; }
  .bot .av { background: linear-gradient(135deg, var(--accent2), var(--accent)); color:#0b0d1a; }
  .bot .bubble { background: var(--panel); border: 1px solid #262a4d; border-top-left-radius: 4px; }
  .user { align-self: flex-end; flex-direction: row-reverse; }
  .user .av { background: #2c3160; color: var(--text); }
  .user .bubble { background: linear-gradient(135deg, #2a2f5e, #3a2f6b); border-top-right-radius: 4px; }
  .bubble .cursor { display:inline-block; width:7px; height:15px; background:var(--accent);
    margin-left:2px; vertical-align:-2px; animation: blink .9s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  footer {
    padding: 14px 18px 20px; border-top: 1px solid #262a4d;
    background: rgba(20,23,43,0.7);
  }
  .inputwrap {
    max-width: 820px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end;
  }
  textarea {
    flex: 1; resize: none; max-height: 140px;
    background: var(--panel2); color: var(--text); border: 1px solid #2e3360;
    border-radius: 14px; padding: 12px 14px; font: inherit; font-size: 14.5px;
    outline: none;
  }
  textarea:focus { border-color: var(--accent2); }
  button#send {
    background: linear-gradient(135deg, var(--accent), #00c46a); color: #06281a;
    border: none; border-radius: 14px; padding: 12px 18px; font-weight: 800;
    cursor: pointer; font-size: 14px; transition: transform .08s, filter .2s;
  }
  button#send:hover { filter: brightness(1.08); }
  button#send:active { transform: scale(.96); }
  button#send:disabled { opacity: .45; cursor: default; }
  .hint { max-width: 820px; margin: 8px auto 0; font-size: 11px; color: var(--muted); text-align: center; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; max-width:820px; margin: 0 auto 12px; }
  .chip {
    background: var(--panel); border:1px solid #2e3360; color: var(--muted);
    padding:7px 11px; border-radius: 20px; font-size:12.5px; cursor:pointer;
  }
  .chip:hover { color: var(--text); border-color: var(--accent2); }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: #2a2f5e; border-radius: 10px; }
</style>
</head>
<body>
<header>
  <div class="badge">G</div>
  <div>
    <h1>Gaffer — EPL Chatbot</h1>
    <p>Powered by Llama 3.1 · live data from TheSportsDB</p>
  </div>
  <div class="live-dot"><i></i> LIVE <span id="season"></span></div>
</header>

<div id="chat"></div>

<footer>
  <div class="chips" id="chips">
    <div class="chip">Show me the current table</div>
    <div class="chip">Who's top of the league right now?</div>
    <div class="chip">What were the latest results?</div>
    <div class="chip">When does Arsenal play next?</div>
  </div>
  <div class="inputwrap">
    <textarea id="input" rows="1" placeholder="Ask about the Premier League…"></textarea>
    <button id="send">Send</button>
  </div>
  <div class="hint">Gaffer uses live standings &amp; fixtures. Press Enter to send · Shift+Enter for a new line.</div>
</footer>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const chips = document.getElementById('chips');
  const seasonEl = document.getElementById('season');

  const history = [];   // {role, content}
  let busy = false;

  fetch('/api/health').then(r => r.json())
    .then(d => { if (d.season) seasonEl.textContent = '· ' + d.season; })
    .catch(() => {});

  function addMessage(role, text) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
    const av = document.createElement('div');
    av.className = 'av';
    av.textContent = role === 'user' ? 'You'[0] : 'G';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    wrap.appendChild(av);
    wrap.appendChild(bubble);
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
    return bubble;
  }

  function greet() {
    addMessage('bot',
      "⚽ Alright! I'm Gaffer, your Premier League mate. I've got the live table, " +
      "latest results and upcoming fixtures in front of me. Ask me anything — " +
      "standings, who's in form, top scorers, history, you name it!");
  }
  greet();

  async function send(text) {
    if (busy) return;
    text = (text || input.value).trim();
    if (!text) return;
    busy = true; sendBtn.disabled = true;
    input.value = ''; input.style.height = 'auto';
    chips.style.display = 'none';

    addMessage('user', text);
    history.push({ role: 'user', content: text });

    const bubble = addMessage('bot', '');
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    bubble.appendChild(cursor);

    let reply = '';
    try {
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history })
      });
      const reader = resp.body.getReader();
      const dec = new TextDecoder();
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        reply += dec.decode(value, { stream: true });
        bubble.textContent = reply;
        bubble.appendChild(cursor);
        chat.scrollTop = chat.scrollHeight;
      }
    } catch (e) {
      reply += '\n\n[Connection error: ' + e.message + ']';
      bubble.textContent = reply;
    }
    cursor.remove();
    history.push({ role: 'assistant', content: reply });
    busy = false; sendBtn.disabled = false;
    input.focus();
  }

  sendBtn.addEventListener('click', () => send());
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });
  chips.addEventListener('click', e => {
    if (e.target.classList.contains('chip')) send(e.target.textContent);
  });
</script>
</body>
</html>
